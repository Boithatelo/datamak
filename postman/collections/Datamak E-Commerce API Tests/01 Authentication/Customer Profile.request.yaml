$kind: http-request
url: "{{baseUrl}}/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const data = pm.response.json();
      pm.test('Correct customer returned', () => pm.expect(data.user.email).to.eql(pm.environment.get('customerEmail')));
      pm.test('Password hash is not exposed', () => pm.expect(data.user.passwordHash).to.be.undefined);
    language: text/javascript
order: 2000
