$kind: http-request
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const data = pm.response.json();
      pm.test('Backend status is ok', () => pm.expect(data.status).to.eql('ok'));
    language: text/javascript
order: 1000
