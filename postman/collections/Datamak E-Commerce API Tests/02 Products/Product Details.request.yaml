$kind: http-request
url: "{{baseUrl}}/products/{{productId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const data = pm.response.json();
      pm.test('Product details returned', () => pm.expect(data.product.id).to.eql(pm.environment.get('productId')));
      pm.test('Related products array returned', () => pm.expect(data.related).to.be.an('array'));
    language: text/javascript
order: 5000
