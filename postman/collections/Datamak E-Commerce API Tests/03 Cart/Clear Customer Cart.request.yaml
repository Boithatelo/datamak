$kind: http-request
url: "{{baseUrl}}/cart"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Cart is empty', () => pm.expect(pm.response.json().cart.items.length).to.eql(0));
    language: text/javascript
order: 1000
