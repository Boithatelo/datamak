$kind: http-request
url: "{{baseUrl}}/cart/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "productId": "{{productId}}",
      "quantity": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', () => pm.response.to.have.status(201));
      const items = pm.response.json().cart.items || [];
      pm.test('Item exists in cart', () => pm.expect(items.some((item) => item.productId === pm.environment.get('productId'))).to.eql(true));
    language: text/javascript
order: 2000
