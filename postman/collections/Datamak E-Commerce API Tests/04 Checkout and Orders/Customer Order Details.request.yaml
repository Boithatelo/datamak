$kind: http-request
url: "{{baseUrl}}/orders/{{orderId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const order = pm.response.json().order;
      pm.test('Correct order returned', () => pm.expect(order.id).to.eql(pm.environment.get('orderId')));
      pm.test('Status history exists', () => pm.expect(order.statusHistory.length).to.be.above(0));
    language: text/javascript
order: 4000
