$kind: http-request
url: "{{baseUrl}}/admin/users"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const users = pm.response.json().users || [];
      pm.test('Users returned', () => pm.expect(users.length).to.be.above(0));
      pm.test('Password hashes are not exposed', () => pm.expect(users.some((user) => user.passwordHash)).to.eql(false));
    language: text/javascript
order: 2000
