$kind: http-request
url: "{{baseUrl}}/orders/{{orderId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "Processing",
      "note": "Postman integration test status update."
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const order = pm.response.json().order;
      pm.test('Order status changed to Processing', () => pm.expect(order.status).to.eql('Processing'));
      pm.test('Status history includes Processing', () => pm.expect(order.statusHistory.some((entry) => entry.status === 'Processing')).to.eql(true));
    language: text/javascript
order: 3000
